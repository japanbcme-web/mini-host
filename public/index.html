<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انشر موقعك</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#1b1f2a;padding:20px;max-width:600px;margin:auto}
.drop{display:block;border:2px dashed #4f46e5;border-radius:16px;padding:40px 16px;text-align:center;background:#fff;cursor:pointer}
input{display:none}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:16px}
.link{display:block;word-break:break-all;color:#4f46e5;font-weight:600;margin:8px 0}.err{color:#dc2626;margin-top:12px}
button{background:#4f46e5;color:#fff;border:0;border-radius:10px;padding:9px 16px}</style></head>
<body><h1>🚀 انشر موقعك بثوانٍ</h1><p>ارفع ملف HTML واحصل على رابط عام.</p>
<label class="drop"><b>اضغط لاختيار ملف HTML</b><br><small>حتى 2 ميجا</small><input type="file" id="f" accept=".html,.htm,text/html"></label>
<div id="out"></div><p><small>المحتوى المرفوع من مسؤولية ناشره.</small></p>
<script>
const out=document.getElementById('out');
document.getElementById('f').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  if(file.size>2097152){out.innerHTML='<div class="err">الملف أكبر من 2 ميجا</div>';return}
  out.innerHTML='<div class="card">جارٍ الرفع...</div>';
  try{
    const html=await file.text();
    const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,html})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'فشل الرفع');
    const url=location.origin+'/s/'+j.id;
    out.innerHTML='<div class="card">✅ تم النشر<a class="link" href="'+url+'" target="_blank">'+url+'</a><button id="cp">نسخ الرابط</button></div>';
    document.getElementById('cp').onclick=()=>navigator.clipboard.writeText(url);
  }catch(err){out.innerHTML='<div class="err">'+err.message+'</div>'}
};
</script></body></html>
